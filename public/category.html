<style>

  padding:6px 10px;

.dark-btn {

/* ✅ MOBILE: HIDE SEARCH BAR */

/* ✅ DARK MODE TEXT FIX */
body.dark,
body.dark h1,
body.dark h2,
body.dark h3,
body.dark h4,
body.dark h5,

body.dark span,

/* ✅ DARK MODE NAVBAR */

}
    body.dark {
        background: black 
    }

/* ✅ CATEGORY GRID */
.section {
  padding:25px 20px;
  max-width:1100px;
  margin:auto;
}

.categories {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
}

.cat-card {
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);
  cursor:pointer;
  transition:0.3s;
}

.cat-card:hover {
  transform: translateY(-5px);
}

.cat-card img {
  width:100%;
  height:150px;
  object-fit:cover;
}

.cat-card h4 {
  margin:0;
  padding:15px;
  text-align:center;
}
   

/* ✅ DARK MODE CARD FIX */
body.dark .cat-card {
  background:#1b0064 !important;
}
    
/* ✅ Footer always bottom */
footer {
  position: fixed;      /* সবসময় নিচে থাকবে */
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111827;
  color: white;
  text-align: center;
  padding: 12px 0;

</head>
<body>

<!-- ✅ NAVBAR (ONE FILE VERSION) -->
<nav>
  <div class="logo-box">
    <img src="images/logo.png" alt="Premium Blinds BD logo">

  <ul class="menu">
    <li onclick="location.href='index.html'">Home</li>
    <li onclick="location.href='category.html'">Category</li>
  </ul>
      
    </div>

  <div class="right-side">
    <input type="text" id="searchInput" placeholder="Search...">
    <button class="dark-btn" onclick="toggleDark()" id="darkIcon">🌙</button>
  </div>
</nav>

<!-- ✅ CATEGORY SECTION -->
<section class="section">
  <h1>Window Blinds Categories</h1>
  <div class="categories" id="categoryBox"></div>
</section>
    
<!-- ✅ FOOTER -->
<footer id="siteFooter">
  <p>© 2026 Premium Blinds BD | Designed by Rokibul Islam Rahat</p>
</footer>

<script>
/* ✅ DARK MODE TOGGLE */
function toggleDark() {
  document.body.classList.toggle("dark");
  let icon = document.getElementById("darkIcon");
  icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

/* ✅ Load categories from data.json */
fetch("data.json")
  .then(res => res.json())
  .then(data => {
    let box = document.getElementById("categoryBox");
    box.innerHTML = "";

    data.categories.forEach(cat => {
      box.innerHTML += `
        <div class="cat-card" onclick="location.href='subcategory.html?cat=${cat.id}'">
          <img src="${cat.image}" alt="${cat.title} - Premium Blinds BD" loading="lazy" decoding="async">
          <h4>${cat.title}</h4>
        </div>
      `;
    });
  });
    /* ✅ Category Search Filtering */
document.getElementById("searchInput").addEventListener("keyup", function () {
    let keyword = this.value.toLowerCase();
    let cards = document.querySelectorAll(".cat-card");

    cards.forEach(card => {
        let title = card.querySelector("h4").innerText.toLowerCase();

        if (title.includes(keyword)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
});
    
    document.getElementById("siteFooter").onclick = function () {
   window.location.href = "index.html";
  // 👉 এখানে তুমি চাইলে অন্য পেজে redirect করতে পারো:
  // window.location.href = "contact.html";
};

</script>

</body>
