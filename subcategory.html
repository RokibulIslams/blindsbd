<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Premium Blinds BD</title>
<meta name="description" content="Premium window blinds in Bangladesh. Explore Zebra, Roller, Vertical, Venetian and Motorized blinds from Premium Blinds BD.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#111827">
<link rel="canonical" href="https://blindsbd.com/subcategory.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Premium Window Blinds | Premium Blinds BD">
<meta property="og:description" content="Explore premium Zebra, Roller, Vertical, Venetian and Motorized blinds in Bangladesh.">
<meta property="og:url" content="https://blindsbd.com/subcategory.html">
<meta property="og:site_name" content="Premium Blinds BD">
<meta property="og:locale" content="bn_BD">
<meta property="og:image" content="https://blindsbd.com/images/logo.png">
<meta property="og:image:alt" content="Premium Blinds BD">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Premium Window Blinds | Premium Blinds BD">
<meta name="twitter:description" content="Explore premium Zebra, Roller, Vertical, Venetian and Motorized blinds in Bangladesh.">
<meta name="twitter:image" content="https://blindsbd.com/images/logo.png">
<meta name="twitter:image:alt" content="Premium Blinds BD">

<script type="application/ld+json" id="categoryBreadcrumbSchema">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
{"@type":"ListItem","position":1,"name":"Home","item":"https://blindsbd.com/"},
{"@type":"ListItem","position":2,"name":"Categories","item":"https://blindsbd.com/category.html"},
{"@type":"ListItem","position":3,"name":"Products","item":"https://blindsbd.com/subcategory.html"}]}
</script>

<script type="application/ld+json" id="productItemListSchema">
{"@context":"https://schema.org","@type":"ItemList","name":"Premium Blinds Products","itemListElement":[]}
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Arial,sans-serif;background:#f5f5f5;transition:.3s;padding-bottom:70px}
nav{background:#222;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
nav .logo-box{display:flex;align-items:center;gap:10px}
nav .logo-box img{height:35px;width:auto}
nav .menu{list-style:none;display:flex;gap:20px;margin:0;padding:0}
nav .menu li{cursor:pointer}
nav .right-side{display:flex;align-items:center;gap:10px}
nav .right-side input{padding:6px 10px;border-radius:4px;border:none;outline:none}
.dark-btn{padding:6px 12px;background:none;border:none;cursor:pointer;font-size:22px;color:#fff}
.section{padding:25px 20px;max-width:1100px;margin:auto}
#categoryIntro{line-height:1.6;margin-top:0}
.breadcrumb{display:flex;align-items:center;gap:8px;margin:8px 0 20px;font-size:14px;flex-wrap:wrap}
.breadcrumb a{color:#2563eb;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span:last-child{color:#666}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.product-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.15);transition:.35s ease;animation:fadeIn .6s ease;background:#111}
.product-card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 15px 35px rgba(0,0,0,.25)}
.product-card img{width:100%;height:260px;object-fit:cover;display:block;transition:.4s ease}
.product-card:hover img{transform:scale(1.08)}
.bottom-overlay{position:absolute;bottom:0;left:0;width:100%;padding:15px 8px;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.05));backdrop-filter:blur(4px);text-align:center}
.bottom-overlay h3{margin:0;font-size:15px;color:#fff}
.bottom-overlay p{margin:3px 0 10px;font-size:15px;font-weight:600;color:#f1f1f1}
.btn-group{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.details-btn,.order-btn{padding:7px 14px;border:none;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;transition:.25s ease;text-decoration:none;display:inline-block}
.details-btn{background:rgba(255,255,255,.85);color:#000}
.order-btn{background:#25D366;color:#fff}
.details-btn:hover,.order-btn:hover{transform:translateY(-2px)}
.no-result{text-align:center;margin-top:20px;font-size:16px;opacity:.8}
footer{position:fixed;bottom:0;left:0;width:100%;background:#111827;color:#fff;text-align:center;padding:12px 0;font-size:14px;cursor:pointer;z-index:50}
footer p{margin:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
body.dark{background:#000;color:#fff}
body.dark nav{background:#111}
body.dark .breadcrumb span:last-child{color:#bbb}
body.dark .product-card{box-shadow:0 8px 25px rgba(255,255,255,.08)}
@media(max-width:600px){
 nav .right-side input{display:none}
 nav{padding:12px 15px}
 nav .menu{gap:12px;font-size:14px}
 .section{padding:20px 12px}
 .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .product-card img{height:210px}
 .bottom-overlay{padding:10px 5px}
 .bottom-overlay h3{font-size:13px}
 .bottom-overlay p{font-size:13px;margin-bottom:7px}
 .details-btn,.order-btn{padding:6px 10px;font-size:11px}
}
@media(max-width:380px){.products{grid-template-columns:1fr}.product-card img{height:250px}}
</style>
</head>
<body>

<nav>
<div class="logo-box">
<img src="images/logo.png" alt="Premium Blinds BD Logo" width="35" height="35" decoding="async">
<ul class="menu">
<li onclick="location.href='index.html'">Home</li>
<li onclick="location.href='category.html'">Category</li>
</ul>
</div>
<div class="right-side">
<input type="text" id="searchInput" placeholder="Search Products..." aria-label="Search Products">
<button class="dark-btn" onclick="toggleDark()" id="darkIcon" aria-label="Toggle dark mode" type="button">🌙</button>
</div>
</nav>

<section class="section">
<h1 id="pageTitle">Premium Window Blinds in Bangladesh</h1>
<p id="categoryIntro">Explore premium window blinds in Bangladesh from Premium Blinds BD.</p>

<nav aria-label="Breadcrumb" class="breadcrumb">
<a href="index.html">Home</a><span>›</span>
<a href="category.html">Categories</a><span>›</span>
<span id="breadcrumbCategory">Products</span>
</nav>

<div class="products" id="productBox"></div>
<div id="noResult" class="no-result" style="display:none;">কোন প্রোডাক্ট পাওয়া যায়নি</div>
</section>

<footer id="siteFooter"><p>© 2026 Premium Blinds BD | Designed by Rokibul Islam Rahat</p></footer>

<script>
function toggleDark(){
 document.body.classList.toggle("dark");
 document.getElementById("darkIcon").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
}

const urlParams=new URLSearchParams(window.location.search);
const catID=urlParams.get("cat");
let allProducts=[];

fetch("data.json?v="+Date.now(),{cache:"no-store"})
.then(res=>{if(!res.ok)throw new Error("Unable to load data.json");return res.json()})
.then(data=>{
 let cat=Array.isArray(data.categories)?data.categories.find(c=>c.id===catID):null;

 if(cat){
  document.getElementById("pageTitle").innerText=cat.title+" in Bangladesh";
  document.getElementById("categoryIntro").innerText=
   "Explore premium "+cat.title+" in Bangladesh from Premium Blinds BD. "+
   "We offer stylish and practical window blinds with custom sizing, professional measurement and installation.";
  document.getElementById("breadcrumbCategory").innerText=cat.title;

  document.title=cat.title+" Products | Premium Blinds BD";

  let seoDescription=("Explore "+cat.title+
   " in Bangladesh from Premium Blinds BD. View premium products, prices and details.")
   .replace(/\s+/g," ").trim().substring(0,160);

  const md=document.querySelector('meta[name="description"]');
  if(md)md.setAttribute("content",seoDescription);

  const canonical=document.querySelector('link[rel="canonical"]');
  if(canonical)canonical.setAttribute("href",window.location.href);

  const ogTitle=document.querySelector('meta[property="og:title"]');
  if(ogTitle)ogTitle.setAttribute("content",cat.title+" | Premium Blinds BD");

  const ogDesc=document.querySelector('meta[property="og:description"]');
  if(ogDesc)ogDesc.setAttribute("content",seoDescription);

  const ogUrl=document.querySelector('meta[property="og:url"]');
  if(ogUrl)ogUrl.setAttribute("content",window.location.href);

  const twTitle=document.querySelector('meta[name="twitter:title"]');
  if(twTitle)twTitle.setAttribute("content",cat.title+" | Premium Blinds BD");

  const twDesc=document.querySelector('meta[name="twitter:description"]');
  if(twDesc)twDesc.setAttribute("content",seoDescription);

  document.getElementById("categoryBreadcrumbSchema").textContent=JSON.stringify({
   "@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
    {"@type":"ListItem","position":1,"name":"Home","item":"https://blindsbd.com/"},
    {"@type":"ListItem","position":2,"name":"Categories","item":"https://blindsbd.com/category.html"},
    {"@type":"ListItem","position":3,"name":cat.title,"item":window.location.href}
   ]
  });
 }

 allProducts=data.subcategories&&Array.isArray(data.subcategories[catID])?data.subcategories[catID]:[];

 document.getElementById("productItemListSchema").textContent=JSON.stringify({
  "@context":"https://schema.org",
  "@type":"ItemList",
  "name":cat?cat.title+" Products":"Premium Blinds Products",
  "itemListElement":allProducts.map((product,index)=>({
   "@type":"ListItem","position":index+1,"name":product.title,
   "url":new URL("product-details.html?id="+encodeURIComponent(product.id),window.location.origin+"/").href
  }))
 });

 renderProducts(allProducts);
})
.catch(error=>console.error("Website data loading error:",error));

function renderProducts(list){
 const box=document.getElementById("productBox");
 const noResult=document.getElementById("noResult");
 box.innerHTML="";
 if(!Array.isArray(list)||!list.length){noResult.style.display="block";return}
 noResult.style.display="none";

 list.forEach(p=>{
  const title=p.title||"Premium Blinds Product";
  const price=p.price||"";
  const id=p.id||"";
  const image=p.image||"";

  box.innerHTML+=`
  <div class="product-card">
   <img src="${image}" alt="${title} - Premium Blinds BD" loading="lazy" decoding="async" width="400" height="260">
   <div class="bottom-overlay">
    <h3>${title}</h3>
    <p>${price} Tk</p>
    <div class="btn-group">
     <a href="product-details.html?id=${encodeURIComponent(id)}" class="details-btn" aria-label="View details of ${title}">View Details</a>
     <button type="button" class="order-btn" onclick='orderNow(${JSON.stringify(title)},${JSON.stringify(price)},${JSON.stringify(id)})'>Order Now</button>
    </div>
   </div>
  </div>`;
 });
}

document.getElementById("searchInput").addEventListener("keyup",function(){
 const keyword=this.value.toLowerCase().trim();
 renderProducts(allProducts.filter(p=>p.title&&p.title.toLowerCase().includes(keyword)));
});

function orderNow(title,price,id){
 const detailsLink="https://blindsbd.com/product-details.html?id="+encodeURIComponent(id);
 const msg=`আমি এই প্রোডাক্টটি কিনতে চাই:\nপ্রোডাক্ট: ${title}\nদাম: ${price} Tk\nপ্রোডাক্ট লিংক: ${detailsLink}`;
 const phone="8801570220362";
 window.location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
}

document.getElementById("siteFooter").onclick=function(){window.location.href="index.html";};
</script>

</body>
</html>
