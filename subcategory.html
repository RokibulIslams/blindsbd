<style>
/* Existing page structure/styles retained */
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;transition:.3s}
a{text-decoration:none;color:inherit}
header{background:#111;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:1000}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:24px;font-weight:700}
.nav-links{display:flex;gap:18px;align-items:center}

.search{width:220px;padding:9px 12px;border-radius:6px;border:1px solid #ddd}
.icon-btn{background:none;border:0;color:#fff;font-size:20px}

.breadcrumb{font-size:14px;margin-bottom:15px;color:#666}

.card-actions a.whatsapp{background:#198754}

@media(max-width:650px){
  .nav{flex-wrap:wrap}
  .nav-links{order:3;width:100%;justify-content:center}
  .search{width:160px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card img{height:180px}
}

<body>
<header>
  <div class="nav">
    <div class="logo"><a href="index.html">Blinds BD</a></div>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="category.html">Categories</a>
      <a href="subcategory.html">Products</a>
    </nav>

    <div class="actions">
      <input id="searchInput" class="search" type="search" placeholder="Search products..." aria-label="Search products">
      <button id="darkToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">☾</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a> › <span id="breadcrumbCategory">Products</span>
  </div>

  <h1 id="categoryTitle">Premium Window Blinds Products in Bangladesh</h1>
  <p id="categoryDesc" class="category-desc">
    Explore premium Zebra, Roller, Vertical, Venetian and Motorized window blinds from Blinds BD.
  </p>

  <section id="productGrid" class="grid" aria-label="Window blinds products"></section>
</main>

<footer>
  © 2026 Blinds BD | Designed by Rokibul Islam Rahat
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const catID = params.get("cat");

const categoryTitle = document.getElementById("categoryTitle");
const categoryDesc = document.getElementById("categoryDesc");
const breadcrumbCategory = document.getElementById("breadcrumbCategory");
const productGrid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");

function setSeo(title, description){
  document.title = title;

  const metaDescription = document.querySelector('meta[name="description"]');
  if(metaDescription) metaDescription.setAttribute("content", description);

  const ogTitle = document.querySelector('meta[property="og:title"]');
  const ogDescription = document.querySelector('meta[property="og:description"]');
  const ogUrl = document.querySelector('meta[property="og:url"]');

  if(ogTitle) ogTitle.setAttribute("content", title);
  if(ogDescription) ogDescription.setAttribute("content", description);
  if(ogUrl) ogUrl.setAttribute("content", "https://blinds.bd/subcategory.html");

  const schema = document.getElementById("webPageSchema");
  if(schema){
    schema.textContent = JSON.stringify({
      "@context":"https://schema.org",
      "@type":"CollectionPage",
      "name":title,
      "description":description,
      "url":"https://blinds.bd/subcategory.html",
      "inLanguage":"bn-BD",
      "isPartOf":{
        "@type":"WebSite",
        "name":"Blinds BD",
        "url":"https://blinds.bd/"
      }
    });
  }
}

function renderProducts(products){
  productGrid.innerHTML = "";

  if(!products.length){
    productGrid.innerHTML = "<p>No products found.</p>";
    return;
  }

  products.forEach(p=>{
    const title = p.title || p.name || "Window Blinds";
    const image = p.image || p.img || "";
    const price = p.price ?? "";
    const id = p.id ?? p.product_id ?? "";

    const card = document.createElement("article");
    card.className = "card";

    const priceText = price !== "" ? `${price} Tk` : "Price on request";

    card.innerHTML = `
      <a href="product-details.html?id=${encodeURIComponent(id)}" aria-label="View details of ${title}">
        <img src="${image}" alt="${title} - Blinds BD" loading="lazy">
      </a>
      <div class="card-body">
        <h3>${title}</h3>
        <div class="price">${priceText}</div>
        <div class="card-actions">
          <a href="product-details.html?id=${encodeURIComponent(id)}">Details</a>
          <a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/8801570220362?text=${encodeURIComponent("I want to order " + title)}">WhatsApp Order</a>
        </div>
      </div>
    `;

    productGrid.appendChild(card);
  });

  const itemList = document.getElementById("itemListSchema");
  if(itemList){
    itemList.textContent = JSON.stringify({
      "@context":"https://schema.org",
      "@type":"ItemList",
      "name": categoryTitle.textContent,
      "itemListElement": products.map((p,index)=>({
        "@type":"ListItem",
        "position":index+1,
        "name":p.title || p.name || "Window Blinds",
        "url":"https://blinds.bd/product-details.html?id=" + encodeURIComponent(p.id ?? p.product_id ?? "")
      }))
    });
  }
}

fetch("data.json")
  .then(res=>res.json())
  .then(data=>{
    let products = [];

    if(catID && data.subcategories && data.subcategories[catID]){
      const subcategory = data.subcategories[catID];

      if(Array.isArray(subcategory)){
        products = subcategory;
      }else{
        products = subcategory.products || [];
        const name = subcategory.name || subcategory.title || "";
        const description = subcategory.description || "";

        if(name){
          categoryTitle.textContent = `${name} Window Blinds in Bangladesh | Blinds BD`;
          breadcrumbCategory.textContent = name;
        }

        if(description){
          categoryDesc.textContent = description;
        }
      }
    }else if(Array.isArray(data.products)){
      products = data.products;
    }

    setSeo(
      categoryTitle.textContent,
      categoryDesc.textContent
    );

    renderProducts(products);

    searchInput.addEventListener("input",()=>{
      const q = searchInput.value.toLowerCase().trim();
      const filtered = products.filter(p=>
        (p.title || p.name || "").toLowerCase().includes(q)
      );
      renderProducts(filtered);
    });
  })
  .catch(err=>{
    console.error(err);
    productGrid.innerHTML = "<p>Products could not be loaded. Please try again.</p>";
  });

document.getElementById("darkToggle").addEventListener("click",()=>{
  document.body.classList.toggle("dark");
});
</script>
</body>
</html>
